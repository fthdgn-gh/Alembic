# MkPFS / AMPR Emu pack profile
# Game:    EA SPORTS UFC 6 (PPSA23566), Frostbite engine
# Status:  runs on the PS5 (AMPR Emu 0.4.2.1, ShadowMountPlus); 166 GB -> about 98 GB
# Use:     mkpfs ampr game --root <game> --output <out> --config ufc6-PPSA23566.toml
#
# Built from two APR trace sessions (ampr profile generate) plus every .cas archive no session read.
# All 292 .cas archives are packed; the .toc files, initfs_Ps5 and chunkmanifest stay loose (packing
# them crashed the game about 40 s in, and they are tiny). The paths are exact, so a game update that
# adds or renames archives leaves the new ones loose until the profile is regenerated.
#
# Projected resident pack index: 47.75 MiB.
# Recommended decoded cache: 512.00 MiB.
# Recommended physical-page cache: 64.00 MiB.
# Recommended runtime workers: 4.
# Recommended latency-reserved workers: 1.
# Recommended AMPR internal pool: 768.00 MiB.

[pack]
index_name = "ampr_assets.index"
pack_pattern = "ampr_assets-{group}-lane{lane:02d}-vol{volume:02d}-{id:03d}.pak"
default_action = "loose"
default_block_size = "64KiB"
io_page_size = "64KiB"
payload_alignment = "64KiB"
chunk_alignment = "64B"
workers = 8
compression_mode = "hc"
compression_level = 12
acceleration = 1
deduplicate = true
deduplicate_scope = "lane"
deduplicate_streaming = false
min_savings_bytes = 64
min_savings_ratio = 0.01
io_neutral_min_savings_bytes = "8KiB"
io_neutral_min_savings_ratio = 0.125
auto_loose_large_files = true
auto_loose_hot_files = false
auto_loose_min_file_size = "64MiB"
auto_loose_sample_blocks = 32
auto_loose_sample_bytes = "16MiB"
auto_loose_min_savings_ratio = 0.05
auto_loose_max_raw_ratio = 0.90
preserve_mtime = true
validate_index_metadata = true

[runtime]
decoded_cache_bytes = 536870912
physical_cache_bytes = 67108864
workers = 4
latency_reserve_workers = 1

[groups.metadata]
pack_count = 4
assignment = "balanced"
max_pack_size = "8GiB"
stripe_large_files = false
io_page_size = "64KiB"

[groups.bulk]
pack_count = 4
assignment = "balanced"
max_pack_size = "16GiB"
stripe_large_files = false
io_page_size = "64KiB"

[groups.stream]
pack_count = 1
assignment = "balanced"
max_pack_size = "16GiB"
stripe_large_files = false
io_page_size = "64KiB"

