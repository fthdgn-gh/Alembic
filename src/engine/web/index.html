<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alembic</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<!--
  Built for the PS5's browser first: everything is reachable with the D-pad,
  ✕ (Enter) and ○ (the browser's Back). Older firmwares ship a Safari-12-era
  WebKit, so the script avoids ?. and ??, and the CSS avoids flex gap, inset,
  aspect-ratio, clamp() and :focus-visible.
-->
<style>
:root {
  --bg: #0b0e14; --bg2: #111621; --panel: #151b27; --panel2: #1b2231; --raise: #222b3d; --line: #263044; --line2: #34405a;
  --text: #e9edf5; --muted: #8e98ad; --dim: #5d677c;
  --accent: #6f93ff; --accent2: #9a7bff; --ok: #3fc282; --bad: #f06a62; --warn: #e6b445;
  --focus: #8fb0ff; --radius: .75rem;
  --x: #8aa7ff; --o: #ff6f8f; --t: #45d6a8; --s: #e993dc;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { font-size: 16px; }
body { margin: 0; background: radial-gradient(ellipse at 20% -10%, #1a2340 0%, rgba(11,14,20,0) 55%), var(--bg); background-color: var(--bg);
  color: var(--text); font: 1rem/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
  display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; word-break: break-all; }
.err { color: var(--bad); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp > * + * { margin-left: .5rem; }

/* Focus: one clear ring, the same everywhere. */
:focus { outline: none; }
.fx:focus, button:focus, input:focus, .row:focus, .card:focus { box-shadow: 0 0 0 .14rem var(--bg), 0 0 0 .3rem var(--focus); }

/* ---------- header ---------- */
.top { display: flex; align-items: center; padding: 1.1rem 2.5rem .9rem; flex: 0 0 auto; }
.logo { display: flex; align-items: center; font-weight: 700; font-size: 1.3rem; letter-spacing: .01em; margin-right: 2rem; }
.logo img { width: 2rem; height: 2rem; margin-right: .65rem; display: block; }
.tabs { display: flex; align-items: center; }
.tab { background: none; border: 0; color: var(--muted); padding: .45rem .9rem; border-radius: .6rem; font-size: 1.05rem; position: relative; margin-right: .25rem; }
.tab.on { color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: .9rem; right: .9rem; bottom: .05rem; height: .16rem; border-radius: .1rem; background: var(--accent); }
.badge { display: inline-block; background: var(--accent); color: #fff; font-size: .72rem; border-radius: 99px; padding: 0 .45rem; min-width: 1.2rem; text-align: center; margin-left: .35rem; vertical-align: .1rem; }
.tabs .shoulder { font-size: .7rem; color: var(--dim); border: 1px solid var(--line2); border-radius: .35rem; padding: .05rem .35rem; margin: 0 .5rem; }
.status { margin-left: auto; font-size: .85rem; color: var(--muted); display: flex; align-items: center; white-space: nowrap; }
.status .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--dim); margin-right: .5rem; }
.status.live .dot { background: var(--accent); box-shadow: 0 0 .6rem var(--accent); }
.status.off .dot { background: var(--bad); }

/* ---------- views ---------- */
.view { flex: 1 1 auto; min-height: 0; padding: 0 2.5rem; }
.files { display: grid; grid-template-columns: 15rem minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-column-gap: 1.75rem; }
.files > * { min-height: 0; }
.scroll { overflow-y: auto; }
/* Thin scrollbars that suit a TV. */
.scroll::-webkit-scrollbar { width: .45rem; height: .45rem; }
.scroll::-webkit-scrollbar-track { background: transparent; }
.scroll::-webkit-scrollbar-thumb { background: rgba(142,152,173,.28); border-radius: .3rem; }
.scroll::-webkit-scrollbar-thumb:hover { background: rgba(142,152,173,.45); }
/* What an overlay covers loses its scrollbars: the console's WebKit can draw a
   scrolling area's bar above a fixed layer. Scroll positions are kept. */
body.covered .view.scroll, body.covered .view .scroll, .overlay.under .scroll { overflow: hidden; }
.page { max-width: 62rem; margin: 0 auto; padding-bottom: 2rem; }

/* rail */
.rail { padding: .25rem .3rem 1rem; }
.rail h3, .sect { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 1rem .55rem .5rem; }
.rail h3:first-child { margin-top: .4rem; }
.ritem { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: .6rem; padding: .55rem .6rem; color: var(--muted); position: relative; }
.ritem .nm { display: flex; align-items: center; }
.ritem .nm svg { width: 1.15rem; height: 1.15rem; margin-right: .6rem; flex: 0 0 auto; opacity: .85; }
.ritem.on { color: var(--text); background: rgba(111,147,255,.08); }
.ritem.on::before { content: ""; position: absolute; left: 0; top: .6rem; bottom: .6rem; width: .18rem; border-radius: .1rem; background: var(--accent); }
.ritem .meter { margin: .4rem 0 0 1.75rem; }
.ritem .free { font-size: .75rem; color: var(--dim); margin: .2rem 0 0 1.75rem; }
.meter { height: .28rem; border-radius: .2rem; background: #263049; overflow: hidden; }
.meter div { height: 100%; background: var(--accent); }
.meter.low div { background: var(--warn); }

/* list */
.main { display: flex; flex-direction: column; }
.bar1 { display: flex; align-items: flex-end; padding: .2rem 0 .8rem; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.where { flex: 1; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; font-size: 1.35rem; font-weight: 600; }
.crumbs button { background: none; border: 0; padding: .1rem .35rem; border-radius: .45rem; color: var(--muted); max-width: 18rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.crumbs button:last-child { color: var(--text); }
.crumbs .sep { color: var(--dim); margin: 0 .1rem; font-weight: 400; }
.summary { font-size: .85rem; color: var(--muted); margin: .2rem .35rem 0; }
.tools { display: flex; }
.tools .btn { margin-left: .5rem; }
.list { flex: 1 1 auto; min-height: 0; padding: .5rem .3rem 1.5rem; }
.row { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto auto; grid-column-gap: 1rem; align-items: center; padding: .55rem .75rem; border-radius: .7rem; cursor: pointer; margin: .15rem 0; position: relative; }
.row:focus { background: rgba(111,147,255,.12); }
.row:hover { background: rgba(255,255,255,.03); }
.row:focus:hover { background: rgba(111,147,255,.14); }
.row .t { font-size: 1.05rem; font-weight: 500; }
.row .s { font-size: .82rem; color: var(--muted); }
.row .sz { font-size: .9rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row .more { background: none; border: 0; color: var(--dim); font-size: 1.2rem; padding: .2rem .5rem; border-radius: .4rem; line-height: 1; }
.row .more:hover { color: var(--text); background: var(--raise); }
.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }

/* icons */
.ico { width: 3.4rem; height: 3.4rem; border-radius: .7rem; display: flex; align-items: center; justify-content: center; font-size: .62rem; font-weight: 800; letter-spacing: .04em; overflow: hidden; background: #1d2433; color: var(--muted); flex: 0 0 auto; }
.ico img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ico svg { width: 55%; height: 55%; }
.ico.folder { background: rgba(111,147,255,.12); color: #8fb0ff; }
.ico.game { background: rgba(111,147,255,.12); color: #8fb0ff; }
.ico.fpkg { background: rgba(111,147,255,.16); color: var(--accent); }
.ico.ffpfsc { background: rgba(63,194,130,.15); color: var(--ok); }
.ico.exfat { background: rgba(230,180,69,.15); color: var(--warn); }
.ico.ffpkg { background: rgba(154,123,255,.16); color: var(--accent2); }
.ico.ffpfs { background: rgba(69,214,168,.14); color: #45d6a8; }
.ico.has-img { background: #0f131b; }
.fmt { display: inline-block; font-size: .66rem; line-height: 1; font-weight: 800; letter-spacing: .06em; padding: .22rem .45rem; border-radius: 99px; margin-right: .45rem; vertical-align: .08rem; background: #2a3142; color: #c5ccdd; }
.fmt.fpkg { background: rgba(111,147,255,.16); color: var(--accent); }
.fmt.ffpfsc { background: rgba(63,194,130,.15); color: var(--ok); }
.fmt.exfat { background: rgba(230,180,69,.15); color: var(--warn); }
.fmt.ffpkg { background: rgba(154,123,255,.16); color: var(--accent2); }
.fmt.ffpfs { background: rgba(69,214,168,.14); color: #45d6a8; }

.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); font-size: .88rem; }
.facts > div { padding: .4rem 0; border-top: 1px solid var(--line); }
.facts > div:nth-child(odd) { color: var(--muted); padding-right: 1rem; }
.facts > div:nth-child(even) { text-align: right; word-break: break-all; }

/* buttons */
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: .65rem; padding: .55rem 1.05rem; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: none; border-color: transparent; }
.btn.block { display: flex; width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: .35rem .75rem; font-size: .9rem; }

/* cards (queue, components, settings) */
.head2 { display: flex; align-items: center; justify-content: space-between; margin: 1rem .2rem .6rem; }
.head2 .sect { margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; margin-bottom: .75rem; display: block; width: 100%; text-align: left; }
.card.click { cursor: pointer; }
.card.click:hover { border-color: var(--line2); }
.card .hd { display: flex; align-items: center; }
.card .hd .ico { width: 3.4rem; height: 3.4rem; margin-right: 1rem; }
.card .ttl { font-weight: 600; font-size: 1.05rem; flex: 1; min-width: 0; }
.card .to { font-size: .85rem; color: var(--muted); }
.card .s { font-size: .85rem; color: var(--text); opacity: .8; }
.card .hd .ico { flex: 0 0 auto; }
.card .line { display: flex; justify-content: space-between; align-items: center; margin-top: .6rem; font-size: .88rem; color: var(--muted); flex-wrap: wrap; }
.card .btns { margin-top: .8rem; text-align: right; }
.card .btns .btn { margin-left: .5rem; }
.pbar { height: .55rem; background: #0a0d13; border-radius: .3rem; overflow: hidden; margin-top: .8rem; }
.pbar div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-transition: width .5s; transition: width .5s; }
.pbar.indet div { width: 30% !important; -webkit-animation: slide 1.4s ease-in-out infinite; animation: slide 1.4s ease-in-out infinite; }
@-webkit-keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.state { font-size: .7rem; padding: .15rem .6rem; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-left: .75rem; white-space: nowrap; }
.state.running { background: rgba(111,147,255,.15); color: var(--accent); }
.state.queued, .state.cancelled { background: #232a3a; color: var(--muted); }
.state.paused { background: rgba(240,180,80,.15); color: var(--warn); }
.state.done { background: rgba(63,194,130,.15); color: var(--ok); }
.state.failed, .state.interrupted { background: rgba(240,106,98,.14); color: var(--bad); }
.tag { display: inline-block; font-size: .72rem; color: var(--muted); border: 1px solid var(--line2); border-radius: .4rem; padding: .05rem .45rem; margin: .15rem 0 0 .35rem; }
.note { color: var(--warn); font-size: .88rem; margin-top: .5rem; }
.card .err { font-size: .88rem; margin-top: .5rem; word-break: break-word; }

/* ---------- overlays ---------- */
.overlay { -webkit-transform: translateZ(0); transform: translateZ(0); position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(4,6,10,.72); display: flex; align-items: center; justify-content: center; padding: 1.5rem 1.5rem 5rem; z-index: 40; -webkit-animation: fade .15s ease-out; animation: fade .15s ease-out; }
@-webkit-keyframes fade { from { opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--panel); border: 1px solid var(--line2); border-radius: 1.1rem; width: 100%; max-width: 38rem; max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 1.5rem 4rem rgba(0,0,0,.6); }
.sheet.wide { max-width: 64rem; }
.sheet.narrow { max-width: 26rem; }
.sh-head { padding: 1.2rem 1.5rem .2rem; font-size: 1.3rem; font-weight: 700; }
.sh-sub { padding: 0 1.5rem; color: var(--muted); font-size: .9rem; }
.sh-body { padding: 1rem 1.5rem; overflow-y: auto; min-height: 0; flex: 1 1 auto; }
.sh-foot { padding: .9rem 1.5rem 1.2rem; display: flex; align-items: center; justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }
.sh-foot .msg { margin-right: auto; font-size: .88rem; padding-right: 1rem; }
.sh-foot .btn { margin-left: .6rem; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .75rem 1rem; border-radius: .6rem; font-size: 1.05rem; margin: .1rem 0; }
.menu-list button:focus { background: var(--accent); color: #fff; box-shadow: none; }
.menu-list button.danger { color: var(--bad); }
.menu-list button.danger:focus { background: var(--bad); color: #fff; }
.menu-list button small { display: block; font-size: .8rem; color: var(--muted); }
.menu-list button:focus small { color: rgba(255,255,255,.8); }

/* form rows */
.cv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-column-gap: 1.75rem; }
.lbl { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 1.1rem .1rem .45rem; }
.lbl:first-child { margin-top: .2rem; }
.opts { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-gap: .5rem; }
.opt { text-align: left; background: #121825; border: 1px solid var(--line2); border-radius: .75rem; padding: .7rem .9rem; }
.opt b { display: block; font-size: 1rem; }
.opt span { font-size: .8rem; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: rgba(111,147,255,.12); }
.opt.sel b::after { content: " ✓"; color: var(--accent); }
.frow { display: flex; align-items: center; width: 100%; text-align: left; background: #121825; border: 1px solid var(--line); border-radius: .75rem; padding: .7rem .9rem; margin-bottom: .5rem; min-height: 3.2rem; }
.frow .fl { flex: 1; min-width: 0; padding-right: 1rem; }
.frow .fl b { display: block; font-weight: 500; }
.frow .fl small { display: block; font-size: .8rem; color: var(--muted); }
.frow .val { color: var(--text); font-weight: 600; white-space: nowrap; display: flex; align-items: center; }
.frow .arr { color: var(--dim); padding: 0 .55rem; font-size: 1.1rem; }
.frow:focus .arr { color: var(--focus); }
.frow .valtext { min-width: 6rem; text-align: center; }
.sw { width: 2.8rem; height: 1.6rem; border-radius: 1rem; background: #2c3549; position: relative; flex: 0 0 auto; -webkit-transition: background .15s; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #c9d1e2; -webkit-transition: left .15s; transition: left .15s; }
.frow.on .sw { background: var(--accent); }
.frow.on .sw::after { left: 1.4rem; background: #fff; }
.indent { margin-left: 1.25rem; padding-left: .9rem; border-left: 2px solid var(--line); }
.input { width: 100%; background: #0d121c; border: 1px solid var(--line2); border-radius: .65rem; padding: .65rem .8rem; }
.input:focus { border-color: var(--focus); }
.side { background: #0f141e; border: 1px solid var(--line); border-radius: .9rem; padding: 1rem 1.1rem; align-self: start; }
.side .head { display: flex; align-items: center; margin-bottom: .6rem; }
.side .head .ico { width: 3.6rem; height: 3.6rem; margin-right: .9rem; }
.side .head b { display: block; font-size: 1.05rem; line-height: 1.3; }
.out { margin-top: .9rem; font-size: .88rem; }
.warnbox { background: rgba(240,106,98,.08); border: 1px solid rgba(240,106,98,.3); border-radius: .7rem; padding: .7rem .9rem; font-size: .92rem; }
.chips { margin-bottom: .6rem; }
.chip { display: inline-block; font-size: .85rem; padding: .3rem .8rem; border-radius: 99px; border: 1px solid var(--line2); background: #121825; margin: 0 .35rem .4rem 0; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.picker { border: 1px solid var(--line); border-radius: .8rem; max-height: 18rem; padding: .3rem; }
.picker .row { grid-template-columns: 2.4rem minmax(0, 1fr); padding: .4rem .6rem; }
.picker .ico { width: 2.4rem; height: 2.4rem; }

/* ---------- hints ---------- */
.hints { position: relative; z-index: 45; background: var(--bg); flex: 0 0 auto; display: flex; justify-content: flex-end; align-items: center; padding: .7rem 2.5rem 1rem; border-top: 1px solid rgba(38,48,68,.6); flex-wrap: wrap; }
.hint { background: none; border: 0; display: inline-flex; align-items: center; color: var(--text); font-size: .95rem; padding: .25rem .55rem; margin-left: .6rem; border-radius: .5rem; }
.hint:hover { background: var(--panel2); }
.hint .g { margin-right: .45rem; display: inline-flex; }
.g svg { width: 1.35rem; height: 1.35rem; display: block; }
.key { display: inline-block; min-width: 1.5rem; text-align: center; font-size: .72rem; font-weight: 700; border: 1px solid var(--line2); border-bottom-width: .15rem; border-radius: .35rem; padding: .05rem .35rem; color: var(--muted); }
.key + .key { margin-left: .2rem; }

#toasts { position: fixed; left: 2.5rem; bottom: 4.3rem; z-index: 60; max-width: 30rem; }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-radius: 99px; padding: .6rem 1.1rem; font-size: .95rem; box-shadow: 0 .6rem 1.5rem rgba(0,0,0,.4); margin-top: .5rem; display: flex; align-items: center; -webkit-animation: rise .2s ease-out; animation: rise .2s ease-out; }
.toast::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); margin-right: .7rem; flex: 0 0 auto; }
.toast.bad::before { background: var(--bad); }
.toast.ok::before { background: var(--ok); }
@-webkit-keyframes rise { from { -webkit-transform: translateY(.5rem); opacity: 0; } }
@keyframes rise { from { transform: translateY(.5rem); opacity: 0; } }

/* ---------- smaller screens ---------- */
@media (max-width: 1250px) { .files { grid-template-columns: 13rem minmax(0, 1fr); } }
@media (max-width: 760px) {
  body { overflow: auto; }
  .top { padding: .8rem 1rem .6rem; flex-wrap: wrap; }
  .logo { margin-right: 1rem; }
  .tabs { order: 3; width: 100%; overflow-x: auto; margin-top: .5rem; }
  .tabs .shoulder { display: none; }
  .view { padding: 0 1rem; }
  .files { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { display: flex; overflow-x: auto; padding: 0 0 .5rem; }
  .rail h3 { display: none; }
  .ritem { width: auto; flex: 0 0 auto; margin-right: .4rem; border: 1px solid var(--line); }
  .ritem .meter, .ritem .free { display: none; }
  .ritem.on::before { display: none; }
  .row { grid-template-columns: 2.8rem minmax(0, 1fr) auto; }
  .row .sz { display: none; }
  .ico { width: 2.8rem; height: 2.8rem; }
  .cv, .opts { grid-template-columns: minmax(0, 1fr); }
  .hints { display: none; }
  #toasts { left: 1rem; right: 1rem; bottom: 1rem; }
  .overlay { padding: .75rem; }
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><img src="/icon.svg" alt="">Alembic</div>
  <nav class="tabs" id="tabs">
    <span class="shoulder" data-pad>L1</span>
    <button class="tab on" data-tab="files" data-key="tab-files" data-i18n="Files">Files</button>
    <button class="tab" data-tab="queue" data-key="tab-queue"><span data-i18n="Queue">Queue</span><span class="badge" id="qcount" hidden>0</span></button>
    <button class="tab" data-tab="deps" data-key="tab-deps" data-i18n="Components">Components</button>
    <button class="tab" data-tab="settings" data-key="tab-settings" data-i18n="Settings">Settings</button>
    <span class="shoulder" data-pad>R1</span>
  </nav>
  <div class="status" id="status"><span class="dot"></span><span id="status-text" data-i18n="connecting…">connecting…</span></div>
</header>

<section class="view files" id="view-files">
  <nav class="rail scroll" id="rail" data-zone="rail" data-column></nav>
  <div class="main">
    <div class="bar1">
      <div class="where"><div class="crumbs" id="crumbs" data-zone="crumbs"></div><div class="summary" id="summary"></div></div>
      <div class="tools" data-zone="tools">
        <button class="btn sm" id="btn-mkdir" data-i18n="New folder">New folder</button>
        <button class="btn sm ghost" id="btn-refresh" data-i18n="Refresh" data-i18n-title="Refresh">Refresh</button>

  if (["failed", "cancelled", "interrupted"].indexOf(j.state) >= 0) items.push({ label: t("Retry"), value: "retry", sub: cpText(j) ? t("Continues from {p}", { p: cpText(j) }) : null });
  if (j.state === "done" && r.output) items.push({ label: t("Show in Files"), value: "show" });
  if (r.smp_source) items.push({ label: t("Hide {name} from ShadowMount+", { name: base(r.smp_source) }), value: "smp-hide", sub: t("So ShadowMount+ switches to the new image") });
  if (r.source_hidden) items.push({ label: t("Show the source to ShadowMount+ again"), value: "smp-show", sub: t("Renames it back to {name}", { name: base(r.source_hidden).slice(1) }) });
  if (!isActive(j)) items.push({ label: t("Remove from history"), value: "remove", sub: cpText(j) ? t("Also deletes its partial output") : null });
  if (!items.length) return;
  const v = await choose(jobText(j).title, items, jobText(j).to);
  if (v === "pause" || v === "resume") await act("POST", "/api/jobs/" + j.id + "/" + v);
  if (v === "up" || v === "down") await act("POST", "/api/jobs/" + j.id + "/move", { direction: v === "up" ? -1 : 1 });
  if (v === "cancel") await act("POST", "/api/jobs/" + j.id + "/cancel");
  if (v === "retry") await act("POST", "/api/jobs/" + j.id + "/retry");
  if (v === "remove") await act("DELETE", "/api/jobs/" + j.id);
  if (v === "show") { showTab("files"); browse(dir(r.output), true, r.output); }
  if (v === "smp-hide") await toggleHidden(r.smp_source);
  if (v === "smp-show") await toggleHidden(r.source_hidden);
}
async function act(method, path, body) {
  try { await api(method, path, body); } catch (e) { toast(tMsg(e.message), "bad"); }
  refreshJobs();
}
$("#btn-clear").addEventListener("click", () => act("POST", "/api/jobs/clear"));

let lastFinished = null;
async function refreshJobs() {
  let jobs;
  // Only a failed request means the engine is gone; a page error is logged as one.
  try { jobs = await api("GET", "/api/jobs"); }
  catch (e) { $("#status-text").textContent = t("Engine not reachable"); $("#status").className = "status off"; return; }
  {
    // Toast and refresh the listing when a job finishes.
    const finished = jobs.filter((j) => !isActive(j)).map((j) => j.id + j.state).join();
    if (lastFinished !== null && finished !== lastFinished) {
      const newest = jobs.filter((j) => j.finished).sort((a, b) => b.finished - a.finished)[0];
      if (newest && newest.state === "done") toast(t("Finished: {name}", { name: base(newest.spec.input) }), "ok");
      if (newest && newest.state === "failed") toast(t("Failed: {name}", { name: base(newest.spec.input) }), "bad");
      if (state.cwd && !overlays.length) browse(state.cwd, false);
      loadInfo().catch(() => {});
    }
    lastFinished = finished;
    state.jobs = jobs; renderJobs();
  }
}

/* ---------- start ---------- */
history.replaceState({ view: "files", path: "/", depth: 0 }, "");
applyStatic();
renderHints();
loadInfo().then(() => browse("/", false)).catch((e) => { $("#status-text").textContent = t("Engine not reachable: {error}", { error: tMsg(e.message) }); browse("/", false); });
refreshJobs();
setInterval(refreshJobs, 1000);
setInterval(() => loadInfo().catch(() => {}), 15000);
</script>
