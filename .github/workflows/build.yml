# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests Alembic on a PC (Linux, macOS), cross-builds the Windows
# executables (llvm-mingw) and tests them on Windows, cross-builds the PS5
# payload (alembic.elf), and bundles them all; a tag "v*" publishes a release.
name: Build

on:
  # Changes that only touch the docs or the screenshot tool build nothing.
  # Tags ignore path filters, so a release always builds.
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - README.md
      - docs/**
      - tools/screenshots/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**
      - tools/screenshots/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: PC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      # The engine's web page is built with Node (src/engine/web/build.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/engine/web/package-lock.json
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      # The page's TypeScript (the build itself only strips the types).
      - name: Check the web page's types
        if: runner.os == 'Linux'
        run: cd src/engine/web && npx tsc --noEmit
      # -v names each test as it starts, so one that hangs shows in the log.
      - name: Unit tests
        run: ./build/alembic_tests -v
        timeout-minutes: 10
      # A tarball keeps the executable bits (zipped artifacts drop them).
      - name: Package
        run: |
          os=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]'); arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          echo "PLATFORM=$os-$arch" >> "$GITHUB_ENV"
          tar -czf "alembic-$os-$arch.tar.gz" -C build alembic alembic-engine
      # Unzipped (archive: false): the artifact is the file, named after it.
      - name: Upload the command-line tool and the engine
        uses: actions/upload-artifact@v7
        with:
          path: alembic-${{ env.PLATFORM }}.tar.gz
          archive: false
          if-no-files-found: error

  # Windows: cross-built on Linux with llvm-mingw (the same clang as the other
  # builds; statically linked, so the .exe files need no DLLs), then tested
  # on a Windows runner.
  windows:
    name: Windows (cross-build)
    runs-on: ubuntu-24.04
    env:
      # mstorsjo/llvm-mingw 20261006 (LLVM 23.1.3), pinned by SHA-256 (also in docs/NOTES.md).
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_SHA256: 5f9c6ed95b2d4bdb2869a488c5fd5857fbdabcf288a0aa3eb1da43f6a08d8ab4
    steps:
      - uses: actions/checkout@v7
      - name: Download llvm-mingw
        run: |
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64" >> "$GITHUB_ENV"
      # The engine's web page is built with Node (src/engine/web/build.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/engine/web/package-lock.json
      - name: Configure
        run: cmake -S . -B build-win -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build build-win -j 4
      - name: Collect
        run: mkdir -p dist && cp build-win/alembic.exe build-win/alembic-engine.exe build-win/alembic_tests.exe dist/
      - name: Upload for the Windows test
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/
          if-no-files-found: error
      - name: Package
        run: (cd dist && zip -q ../alembic-windows-x64.zip alembic.exe alembic-engine.exe)
      - name: Upload the command-line tool and the engine
        uses: actions/upload-artifact@v7
        with:
          path: alembic-windows-x64.zip
          archive: false
          if-no-files-found: error

  windows-test:
    name: Windows (test)
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-build
          path: dist
      - name: Unit tests, conversions and the engine
        run: tools/windows/smoke.sh dist

  ps5:
    name: PS5 payload
    runs-on: ubuntu-24.04
    env:
      # ps5-payload-dev/sdk v0.44, pinned by SHA-256 (also in docs/NOTES.md).
      SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip
      SDK_SHA256: 4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18
      # The engine's web page is built with Node (src/engine/web/build.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/engine/web/package-lock.json
      - name: Download the PS5 payload SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP"
      - name: Build the payload
        env:
          LLVM_CONFIG: llvm-config-18
        run: PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk" tools/ps5/build.sh
      # The version in file names: the tag (v0.1.0), else branch-commit (main-a2fab12).
      - name: Version
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          [[ $GITHUB_REF == refs/tags/* ]] || version="$version-${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Name it alembic-<version>.elf
        run: mkdir -p dist && cp build-ps5/alembic.elf "dist/alembic-$VERSION.elf"
      # Its own artifact, unzipped, so the payload downloads as it is.
      - name: Upload the payload
        uses: actions/upload-artifact@v7
        with:
          path: dist/alembic-${{ env.VERSION }}.elf
          archive: false
          if-no-files-found: error

  # The console app (app/): a native PS5 title drawn with ps5-homebrew-ui,
  # carrying the payload the job above built, as a folder for ShadowMount+
  # (zipped). Its build fetches the payload SDK v0.42 and the ps5-opengl SDK
  # itself, checked against pinned SHA-256s.
  app:
    name: PS5 app
    needs: ps5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 18 and ninja
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 libclang-rt-18-dev ninja-build
      - name: Version
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          [[ $GITHUB_REF == refs/tags/* ]] || version="$version-${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: alembic-${{ env.VERSION }}.elf
          path: payload
      - name: Build the app
        run: ALEMBIC_ENGINE_ELF="$PWD/payload/alembic-$VERSION.elf" app/build.sh
      - name: Name it alembic-app-<version>.zip
        run: mkdir -p dist && cp build-app/dist/PPSA99594.zip "dist/alembic-app-$VERSION.zip"
      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          path: dist/alembic-app-${{ env.VERSION }}.zip
          archive: false
          if-no-files-found: error

  # Everything in one archive: the payload, the PC builds and the license
  # files. Every run uploads it; a "v*" tag also publishes it as a release.
  bundle:
    name: Bundle
    needs: [pc, ps5, app, windows-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The version in file names: the tag (v0.1.0), else branch-commit (main-a2fab12).
      - name: Version
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          [[ $GITHUB_REF == refs/tags/* ]] || version="$version-${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: alembic-${{ env.VERSION }}.elf
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: alembic-linux-x64.tar.gz
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: alembic-macos-arm64.tar.gz
          path: artifacts
      # A .zip artifact is unpacked: the app folder lands here.
      - uses: actions/download-artifact@v8
        with:
          name: alembic-app-${{ env.VERSION }}.zip
          path: artifacts/app
      # download-artifact unpacks a .zip artifact: the .exe files land here.
      - uses: actions/download-artifact@v8
        with:
          name: alembic-windows-x64.zip
          path: artifacts/windows-x64
      - name: Assemble
        run: |
          name="alembic-$VERSION"
          elf="alembic-$VERSION.elf"
          echo "BUNDLE=$name" >> "$GITHUB_ENV"
          mkdir -p "dist/$name/ps5"
          ls -la artifacts
          cp "artifacts/$elf" "dist/$name/ps5/"
          for t in artifacts/alembic-*.tar.gz; do
            platform=$(basename "$t" .tar.gz); platform=${platform#alembic-}
            mkdir -p "dist/$name/$platform"
            tar -xzf "$t" -C "dist/$name/$platform"
          done
          mkdir -p "dist/$name/windows-x64"
          cp artifacts/windows-x64/alembic.exe artifacts/windows-x64/alembic-engine.exe "dist/$name/windows-x64/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/$name/"
          cp "artifacts/$elf" dist/
          # The console app: its folder (PPSA99594) in the bundle, and zipped on its own.
          cp -R artifacts/app/PPSA99594 "dist/$name/ps5/"
          app="alembic-app-$VERSION.zip"
          # Stored 0777: the console starts an app only when its files are open to all.
          (cd artifacts/app && python3 -m zipfile -c "../../dist/$app" PPSA99594)
          python3 third_party/ps5-homebrew-ui/tools/zip-open-modes.py "dist/$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          (cd dist && zip -qr "$name.zip" "$name")
          # Each PC build on its own too, with the README and licenses:
          # .tar.gz for Linux and macOS (it keeps the executable bits), .zip for Windows.
          packages=()
          for platform in linux-x64 macos-arm64 windows-x64; do
            pkg="$name-$platform"
            mkdir -p "dist/pkg/$pkg"
            cp -p "dist/$name/$platform/"* "dist/pkg/$pkg/"
            cp README.md LICENSE THIRD_PARTY_NOTICES.md "dist/pkg/$pkg/"
            if [[ $platform == windows-* ]]; then
              (cd dist/pkg && zip -qr "../$pkg.zip" "$pkg"); packages+=("$pkg.zip")
            else
              tar -czf "dist/$pkg.tar.gz" -C dist/pkg "$pkg"; packages+=("$pkg.tar.gz")
            fi
          done
          echo "PACKAGES=${packages[*]}" >> "$GITHUB_ENV"
          (cd dist && sha256sum "$name.zip" "$elf" "$app" "${packages[@]}" > SHA256SUMS)
          (cd dist && find "$name" -type f | sort && ls -la "${packages[@]}" && cat SHA256SUMS)
      # The zip itself (archive: false), not a zip inside a zip; it keeps the
      # executable bits.
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.BUNDLE }}.zip
          archive: false
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the tag's message; the checkout may hold the tag
        # without its annotation, so fetch it first.
        run: |
          git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > dist/notes.md
          assets=("dist/$BUNDLE.zip" "dist/alembic-$VERSION.elf" "dist/$APP" dist/SHA256SUMS)
          for p in $PACKAGES; do assets+=("dist/$p"); done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --title "Alembic $GITHUB_REF_NAME" --notes-file dist/notes.md
