# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests Alembic on a PC (Linux, macOS) and cross-builds the PS5
# payload (alembic.elf). A tag "v*" also publishes a release with the payload.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc:
    name: PC (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 4
      - name: Unit tests
        run: ./build/alembic_tests
      - name: Upload the command-line tool and the engine
        uses: actions/upload-artifact@v4
        with:
          name: alembic-${{ runner.os }}
          path: |
            build/alembic
            build/alembic-engine
          if-no-files-found: error

  ps5:
    name: PS5 payload
    runs-on: ubuntu-24.04
    env:
      # ps5-payload-dev/sdk v0.44, pinned by SHA-256 (also in docs/NOTES.md).
      SDK_URL: https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip
      SDK_SHA256: 4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Download the PS5 payload SDK
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.zip" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP"
      - name: Build alembic.elf
        env:
          LLVM_CONFIG: llvm-config-18
        run: PS5_PAYLOAD_SDK="$RUNNER_TEMP/ps5-payload-sdk" tools/ps5/build.sh
      - name: Upload the payload
        uses: actions/upload-artifact@v4
        with:
          name: alembic-ps5
          path: build-ps5/alembic.elf
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, ps5]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alembic-ps5
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum alembic.elf > alembic.elf.sha256
          gh release create "$GITHUB_REF_NAME" alembic.elf alembic.elf.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Alembic $GITHUB_REF_NAME" --generate-notes
